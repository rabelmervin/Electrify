<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wasmCloud Invoice Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #0f3460;
            margin-bottom: 20px;
            color: #e94560;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background-color: #0f3460;
            color: #fff;
            box-sizing: border-box;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .item-row input {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #c81d3f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>wasmCloud Invoice Demo</h2>
        <form action="/order" method="POST">
            <div class="form-group">
                <label>Customer Name:</label>
                <input type="text" name="customer" value="Acme Corp" required>
            </div>
            
            <label>Items:</label>
            <div class="item-row">
                <input type="text" name="item_name_1" value="Widget A">
                <input type="number" name="item_qty_1" value="3" min="1" placeholder="Qty">
                <input type="number" name="item_price_1" value="49.99" step="0.01" placeholder="Price">
            </div>
            <div class="item-row">
                <input type="text" name="item_name_2" value="Widget B">
                <input type="number" name="item_qty_2" value="1" min="1" placeholder="Qty">
                <input type="number" name="item_price_2" value="199.99" step="0.01" placeholder="Price">
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Coupon Code (Discount %):</label>
                <input type="number" name="discount" value="10" min="0" max="100">
            </div>

            <button type="submit">Generate Invoice</button>
        </form>
    </div>
</body>
</html>
